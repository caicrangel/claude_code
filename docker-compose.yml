services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-fuel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fuel}
      POSTGRES_DB: ${DB_NAME:-fuel}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fuel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./certs:/app/certs:ro

  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./certs:/app/certs:ro

volumes:
  dbdata:
