<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cota Diesel{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v=5">
  <script>
    // tema aplicado antes da pintura para evitar flash
    (function(){
      try {
        var t = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) { document.documentElement.setAttribute('data-theme','dark'); }
    })();
    function toggleTheme(){
      try {
        var c = document.documentElement.getAttribute('data-theme') || 'dark';
        var n = c === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', n);
        localStorage.setItem('theme', n);
        document.dispatchEvent(new CustomEvent('themechange', {detail: n}));
      } catch(e) { console.error('toggleTheme', e); }
    }
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/dashboard">
      {% if logo_url %}
        <img src="{{ logo_url }}" alt="{{ empresa_nome }}" class="logo">
      {% else %}
        <span>{{ empresa_nome or 'Cota Diesel' }}</span>
      {% endif %}
    </a>
    <nav>
      {% if request.session.get('auth') %}
        <a href="/dashboard">Visão geral</a>
        <a href="/relatorios">Relatórios</a>
        <a href="/configuracao">Configuração</a>
      {% endif %}
      <button type="button" class="theme-toggle"
              onclick="toggleTheme()"
              title="Alternar tema claro/escuro"
              aria-label="Alternar tema">
        <span class="theme-dark">🌙</span><span class="theme-light">☀</span>
      </button>
      {% if request.session.get('auth') %}
        <a href="/logout">Sair</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
